<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Playlist App</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/variables.css">
</head>
<body>
     <header>
        <h1>Music Playlist App</h1>
        <p>Create your own music playlist</p>
    </header>
<main>
    <section class="music-collection">
        <h2>Music Collection</h2>
        <input type="search" id="search-input" placeholder="Search songs or artists...">
        <select id="genre-filter">
            <option value="all">All genres</option>
        </select>
        <select id="sort-select">
    <option value="default">Default order</option>
    <option value="title">Title</option>
    <option value="artist">Artist</option>
    <option value="duration">Duration</option>
</select>
        <div id="song-list"></div>

    </section>
    <section class="my-playlist">
        <h2>My Playlist</h2>
        <div id="playlist"></div>
        <p>Total duration: <span id="total-duration">0:00</span></p>

    </section>
</main>
<script src="songs.js"></script>
<script src="app.js"></script>
   
    
</body>
</html>
